<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Treinamento de Rede Neural - Perceptron Multi-Layer</title>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

    <!-- Biblioteca de graficos do Google (usada apenas para as curvas da direita).
         Se a pagina for aberta sem internet, o painel e o treinamento continuam
         funcionando normalmente: so as curvas deixam de aparecer. -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <!-- A rede neural e a animacao sao JavaScript puro, sem biblioteca nenhuma. -->
    <script src="funcoes_auxiliares.js"></script>
    <script src="motor_rede_neural.js"></script>
    <script src="animacao_rede_neural.js"></script>
    <script src="rna_pml_js_puro.js"></script>
</head>

<body>

    <div id="containerDrawRNAeGrafico">

        <!-- ================================================================
             COLUNA DA ESQUERDA: arquitetura, desenho animado e hiper-parametros
             ============================================================= -->
        <div id="id_PrincipalContainerDrawRNA">

            <div class="tituloDoPainel">
                <label>Montando a Arquitetura da Rede Neural Perceptron Multi-Layer</label>
            </div>

            <!-- ---------- botoes que montam a arquitetura ---------- -->
            <div class="faixaDeArquitetura">

                <div class="grupoDeCamada">
                    <div id="faixaBotoes" class="rotuloDaCamada">
                        <label>Camada Entrada</label>
                        <label>Qtde. Neuronios</label>
                        <label id="entradaQtdeNeuronios" class="contadorGrande">3</label>
                    </div>
                    <div class="colunaDeBotoes">
                        <button id="entradaQtdeNeuronioxRemover" class="botaoSubtrair botaoAlto"
                            title="Remover um neuronio da camada de entrada"
                            onclick="adicionarOuRemoverNeuroniosCamadaDeEntrada('-')">-</button>
                    </div>
                    <div class="colunaDeBotoes">
                        <button id="entradaQtdeNeuronioxAdicionar" class="botaoSomar botaoAlto"
                            title="Adicionar um neuronio a camada de entrada"
                            onclick="adicionarOuRemoverNeuroniosCamadaDeEntrada('+')">+</button>
                    </div>
                </div>

                <div id="containerCamadaEscondidaGeral">
                    <div id="faixaBotoesQtdeCamadasEscondida">
                        <label id="escondidaQtdeNeuroniox">Camadas Escondidas&nbsp;</label>
                        <button id="escondidaQtdeNeuronioxRemover" class="botaoSubtrair"
                            title="Remover a ultima camada escondida"
                            onclick="criarComponentesDaCamadaEscondida('-')">-</button>
                        &nbsp;
                        <button id="escondidaQtdeNeuronioxAdicionar" class="botaoSomar"
                            title="Adicionar mais uma camada escondida"
                            onclick="criarComponentesDaCamadaEscondida('+')">+</button>
                        <label id="qtdeCamadasEscondidasMostrador" class="contadorPequeno">1</label>
                    </div>

                    <!-- Um cartao por camada escondida. Os demais sao criados por JavaScript. -->
                    <div id="containerCamadaEscondidaMostrador" class="scroll-fino">
                        <div id="camadaEscondidaMostrador0" class="cartaoCamadaEscondida">
                            <label>Neuronios</label>
                            <div style="display: flex; flex-direction: row;">
                                <button id="escondidaQtdeNeuronioxRemover0" class="botaoSubtrair2"
                                    onclick="adicionarOuRemoverNeuroniosCamadaEscondida(this)">-</button>
                                <button id="escondidaQtdeNeuronioxAdicionar0" class="botaoSomar2"
                                    onclick="adicionarOuRemoverNeuroniosCamadaEscondida(this)">+</button>
                                <label id="qtdeNeuronioCamadaEscondida0" class="contadorNeuronios">4</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grupoDeCamada">
                    <div id="faixaBotoesDeSaidas" class="rotuloDaCamada">
                        <label>Camada Saida</label>
                        <label>Qtde. Neuronios</label>
                        <label id="saidaQtdeNeuronios" class="contadorGrande">1</label>
                    </div>
                    <div class="colunaDeBotoes">
                        <button id="saidaQtdeNeuronioxRemover" class="botaoSubtrair botaoAlto"
                            title="Remover um neuronio da camada de saida"
                            onclick="adicionarOuRemoverNeuroniosCamadaDeSaida('-')">-</button>
                    </div>
                    <div class="colunaDeBotoes">
                        <button id="saidaQtdeNeuronioxAdicionar" class="botaoSomar botaoAlto"
                            title="Adicionar um neuronio a camada de saida"
                            onclick="adicionarOuRemoverNeuroniosCamadaDeSaida('+')">+</button>
                    </div>
                </div>

            </div>

            <!-- ---------- o desenho animado da rede ---------- -->
            <!-- As bolinhas dos neuronios sao criadas aqui dentro por JavaScript,
                 e o <canvas id="meuCanvas"> desenha os fios, os pulsos e os
                 proprios neuronios por cima delas. -->
            <div id="containerDrawRNA"></div>

            <div class="faixaDoDesenho">
                <span id="id_resumoArquitetura" class="resumoArquitetura">&nbsp;</span>
                <span class="grupoDeInterruptores">
                    <label title="Liga e desliga a animacao dos pulsos no canvas">
                        <input type="checkbox" id="id_animacaoLigada" checked> Animar
                    </label>
                    <label title="Mostra o valor de ativacao dentro de cada neuronio">
                        <input type="checkbox" id="id_mostrarValores" checked> Valores
                    </label>
                    <label title="Escreve o peso sobre cada fio (so quando ha poucos fios)">
                        <input type="checkbox" id="id_mostrarPesos"> Pesos
                    </label>
                </span>
            </div>

            <div class="faixaDeBotoesDoCanvas">
                <button id="pintarNeuronio" class="botaoInidiarCss"
                    title="Roda a animacao sem treinar, so para ver o caminho do sinal">Testar Conexoes</button>
                <button id="limparCanvas" title="Para tudo e limpa o desenho">Limpar Canvas</button>
            </div>

            <!-- ---------- hiper-parametros ---------- -->
            <div class="blocoHiperParametros">

                <label class="tituloHiperParametros">Configuracao dos Hyper-Parametros:</label>

                <div class="linhaHiperParametros">

                    <div class="campoHiperParametro">
                        <label title="O tamanho do passo que a rede da ao corrigir cada peso.">Taxa Aprendizagem:</label>
                        <input id="id_taxaDeAprendizagem" value="0.1">
                    </div>

                    <div class="campoHiperParametro">
                        <label title="Puxa os pesos na direcao do zero, evitando que a rede decore os dados.">Regulacao
                            Lambda:</label>
                        <input id="id_regulacaoLambda" value="0.0001">
                    </div>

                    <div class="campoHiperParametro">
                        <label title="Quantas vezes a rede vai percorrer o conjunto de dados inteiro.">Epocas
                            Treinamento:</label>
                        <input id="id_epocasDeTreinamento" value="300">
                    </div>

                </div>

                <div class="linhaHiperParametros">

                    <div class="campoHiperParametro">
                        <label title="A nao-linearidade das camadas escondidas. E ela que permite a rede aprender curvas.">Ativacao
                            (ocultas):</label>
                        <select id="id_funcaoAtivacaoOculta">
                            <option value="sigmoide" selected>Sigmoide</option>
                            <option value="tanh">Tangente Hiperbolica</option>
                            <option value="relu">ReLU</option>
                            <option value="leakyRelu">Leaky ReLU</option>
                            <option value="linear">Linear (sem ativacao)</option>
                        </select>
                    </div>

                    <div class="campoHiperParametro">
                        <label title="Linear serve para prever numeros; Sigmoide serve para prever 0 ou 1.">Ativacao
                            (saida):</label>
                        <select id="id_funcaoAtivacaoSaida">
                            <option value="linear" selected>Linear</option>
                            <option value="sigmoide">Sigmoide</option>
                            <option value="tanh">Tangente Hiperbolica</option>
                        </select>
                    </div>

                    <div class="campoHiperParametro">
                        <label title="Devagar da para acompanhar cada onda percorrendo a rede.">Velocidade: <span
                                id="id_rotuloVelocidade" class="rotuloVelocidade">normal</span></label>
                        <input id="id_velocidadeTreinamento" type="range" min="1" max="100" value="45">
                    </div>

                </div>

                <div class="linhaDeControles">
                    <button id="botaoIniciar" class="botaoInidiarCss">Iniciar</button>
                    <button id="id_botaoPausar" class="botaoControle" disabled>Pausar</button>
                    <button id="id_botaoParar" class="botaoControle botaoParar" disabled>Parar</button>
                    <span id="id_situacaoTreinamento" class="situacaoTreinamento">Pronto para treinar</span>
                </div>

            </div>

        </div>

        <!-- ================================================================
             COLUNA DA DIREITA: saida da rede e graficos
             ============================================================= -->
        <div class="divResultadoEGraficos">

            <div class="painelDeSaida">
                <h2>Saida da Rede Neural:</h2>
                <div style="display: flex; flex-direction: row;">
                    <div class="caixaDeResultado">
                        <label>Resultado Real:</label>
                        <label id="resultadoReal">0</label>
                    </div>
                    <div class="caixaDeResultado">
                        <label>Resultado Previsto:</label>
                        <label id="resultadoPrevisto">0</label>
                    </div>
                    <div class="caixaDeResultado">
                        <label>Erro Quadratico Medio:</label>
                        <label id="erroQuadraticoMedio">0</label>
                    </div>
                </div>
            </div>

            <!-- Curva do erro: e aqui que se ve a rede aprendendo de verdade. -->
            <div id="graficoErro" class="divgraficos graficoDeErro"></div>

            <!-- Uma curva "real x previsto" por amostra. As demais sao criadas
                 por JavaScript conforme a quantidade de amostras. -->
            <div id="divGraficoVariosGraficos">
                <div class="divgraficos" id="grafico0"></div>
            </div>

        </div>

    </div>


    <!-- ====================================================================
         SEGUNDA LINHA: pesos sinapticos e campos de dados
         ================================================================= -->
    <div id="id_div_segunda_linha" class="div_componente">

        <div class="div_text_area">
            <label for="pesosEntrada">Pesos de Entrada:</label>
            <textarea id="pesosEntrada" class="textarea-componente" readonly></textarea>
        </div>

        <div class="div_text_area">
            <label for="pesosEscondidos">Pesos Escondidos:</label>
            <textarea id="pesosEscondidos" class="textarea-componente" readonly></textarea>
        </div>

        <div class="div_text_area">
            <label for="pesosSaida">Pesos de Saida:</label>
            <textarea id="pesosSaida" class="textarea-componente" readonly></textarea>
        </div>

        <div id="id_divEntradaDeDadosPrincipalContainer" class="div_dados_de_entrada">

            <div style="display: flex; flex-direction: row; justify-content: center; width: 100%;">
                <div style="display: flex; justify-content: center; width: 15%;">
                    <label class="iconCogsConfigEntradasDeDados" title="Configurar Entrada de Dados"
                        onclick="mostrar_e_esconder_div_configuracao_entrada('block')">
                        <i class="fa fa-cogs" aria-hidden="true"></i>
                    </label>
                </div>
                <div style="display: flex; justify-content: center; width: 85%; padding-right: 50px;">
                    <label style="color: #00eeff;">Dados de Entrada</label>
                </div>
            </div>

            <div id="id_div_dados_de_entrada_input" class="div_dados_de_entrada_input">
                <label id="id_label_saida" style="color:#ffeb3b">Dados de Saida</label>
            </div>

        </div>

    </div>


    <!-- ====================================================================
         TERCEIRA LINHA: saidas por epoca
         ================================================================= -->
    <div id="id_div_terceira_linha" class="div_componente2">
        <label for="valoresDeSaidas">&nbsp;&nbsp;Valores de Saida da Rede ao Final de Cada Epoca:</label>
        <textarea id="valoresDeSaidas" class="textarea-componente2" readonly></textarea>
    </div>


    <!-- ====================================================================
         CAIXA DE CONFIGURACAO DA ENTRADA DE DADOS
         ================================================================= -->
    <div id="id_div_configuracao_entrada_de_dados" class="div_componente3">
        <br>

        <div style="display: flex; flex-direction: row; justify-content: center; width: 100%;">
            <div style="display: flex; justify-content: flex-start; width: 15%;">
                <label class="iconCogsConfigEntradasDeDadosNormalizado" title="Mostrar Dados Normalizados"
                    onclick="toggleIconAndCallFunction(null)">
                    <i id="icon_arrow" class="fa fa-arrow-left" aria-hidden="true"></i>
                </label>
            </div>
            <div style="display: flex; justify-content: center; width: 85%; padding-right: 50px;">
                <label style="color: #00eeff;">Entrada de Dados - Configuracoes</label>
            </div>
        </div>

        <div style="display: flex; justify-content: center; margin-top: 8px;">
            <div class="configEntradaDeDados1">

                <div class="configEntradaDeDados2">
                    <label>Qtde. Chaves</label>
                    <label id="idQtdeChaves">0</label>
                </div>

                <div class="configEntradaDeDados2">
                    <label title="Sim = treina com o 1o registro. Nao = treina com todos.">Usar So o 1o Indice</label>
                    <button id="id_botaoUsarSoUmIndice" style="cursor: pointer;"
                        onclick="this.textContent = this.textContent.trim() === 'Sim' ? 'Nao' : 'Sim';">Nao</button>
                </div>

                <div class="configEntradaDeDados2">
                    <label title="Quantas colunas do final do JSON sao a resposta esperada.">Qtde. Saida Rede</label>
                    <input id="idQtdeSaidaRede" type="number" min="1" value="1" style="width: 45px; text-align: center;">
                </div>

                <div class="configEntradaDeDados2">
                    <label style="color: transparent;">A</label>
                    <button id="idCarregarJson" class="botaoCarregarJson">Carregar JSON</button>
                </div>

            </div>
        </div>

        <div style="display: flex; justify-content: center; margin-top: 10px;">
            <button id="id_aplicar_configuracoes" class="aplicarConfigEntrada"
                onclick="criandoElementoDeEntradaDeDados()">Aplicar Configuracoes</button>
        </div>

        <!-- Conjunto de dados inicial. Pode ser trocado aqui ou por "Carregar JSON".
             As ULTIMAS colunas sao a resposta que a rede deve aprender a prever. -->
        <textarea id="idObjetoDeDadosDeEntrada" class="textarea-componente3">
[
    { "horasEstudo": 57, "horasSono": 8, "simuladoPorcentagem": 91, "notaProvaPorcentagem": 97 },
    { "horasEstudo": 25, "horasSono": 5, "simuladoPorcentagem": 90, "notaProvaPorcentagem": 75 },
    { "horasEstudo": 15, "horasSono": 7, "simuladoPorcentagem": 85, "notaProvaPorcentagem": 80 },
    { "horasEstudo": 40, "horasSono": 6, "simuladoPorcentagem": 88, "notaProvaPorcentagem": 89 },
    { "horasEstudo": 5,  "horasSono": 4, "simuladoPorcentagem": 60, "notaProvaPorcentagem": 55 }
]
</textarea>

    </div>


    <!-- ====================================================================
         CAIXA DOS DADOS NORMALIZADOS
         ================================================================= -->
    <div id="id_div_configuracao_entrada_de_dados_normalizado" class="div_componente4">
        <br>
        <label>&nbsp;&nbsp;&nbsp;&nbsp;Saida de Dados Normalizados:</label>
        <textarea id="idObjetoDeDadosDeEntradaNormalizado" class="textarea-componente4" readonly></textarea>
    </div>

    <div id="fundoCaixaDeDialogBlackTranslucido_id" class="fundoCaixaDeDialogBlackTranslucido_css"></div>

    <script src="funcoes_principal_do_frontend.js"></script>

</body>

</html>
